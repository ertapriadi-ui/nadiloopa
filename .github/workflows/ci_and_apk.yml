name: NADILOOPA CI & Android APK

on:
  push:
    branches:
      - main
      - "feat/**"
      - "stream/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  qa-and-android-build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2-stable"
      GODOT_DIR_VERSION: "4.7.2.stable"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools & Platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-36" >/dev/null

      - name: Cache Godot 4.7.2 Editor & Export Templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-v1

      - name: Download Godot 4.7.2 & Export Templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot-bin ~/.local/share/godot/export_templates/${{ env.GODOT_DIR_VERSION }}
          BASE_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}"
          curl -fsSL -o /tmp/godot.zip "$BASE_URL/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          mv /tmp/godot-bin/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 /tmp/godot-bin/godot
          chmod +x /tmp/godot-bin/godot
          rm -f /tmp/godot.zip

          curl -fsSL -o /tmp/templates.tpz "$BASE_URL/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz 'templates/*' -d ~/.local/share/godot/export_templates/${{ env.GODOT_DIR_VERSION }}
          rm -f /tmp/templates.tpz

      - name: Import Assets in Godot Headless
        run: /tmp/godot-bin/godot --headless --path . --import --quit

      - name: Run Automated QA & 100-Level Simulation
        run: /tmp/godot-bin/godot --headless --path . -s res://tests/test_suite.gd

      - name: Configure Android Export Settings & Debug Keystore
        run: |
          mkdir -p ~/.config/godot ~/.local/share/godot/keystores build/android
          if [ ! -f ~/.local/share/godot/keystores/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.local/share/godot/keystores/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cat <<EOF > ~/.config/godot/editor_settings-4.7.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export Android Debug APK
        run: |
          /tmp/godot-bin/godot --headless --path . --export-debug "Android Debug" build/android/nadiloopa_debug.apk
          ls -lh build/android/nadiloopa_debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadiloopa-android-apk
          path: build/android/nadiloopa_debug.apk
          retention-days: 30
